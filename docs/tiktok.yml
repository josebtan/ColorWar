# ==================================================================================
#  CHATPOINTSTTV - EVENTOS DE TIKTOK  ·  ENFOCADO EN EL MINIJUEGO COLORWAR
# ==================================================================================
#  Cada evento del LIVE actúa sobre la PARTIDA DE COLORWAR en la que está el streamer
#  ({streamer}). Si el streamer no está en una partida, el comando se ignora.
#
#  Todo se hace con "RUN CONSOLE cw live ...". Comandos disponibles:
#
#    cw live speed      {streamer} [nivel 1-5] [segundos]       velocidad temporal
#    cw live slow       {streamer} [nivel 1-5] [segundos]       lentitud temporal (troll)
#    cw live shield    {streamer} [segundos]                    escudo: su estela no se puede cortar
#    cw live freeze     {streamer} [segundos]                   no se puede mover (troll)
#    cw live grow       {streamer} [%] [veces]                  regala territorio (% del campo)
#    cw live addbot     {streamer} [nivel 1-3] [ally|enemy|auto] [cantidad] [nombre]
#                                                               bot con el nombre del espectador
#    cw live killbot    {streamer} [cantidad]                   elimina bots rivales al azar
#    cw live removebot  {streamer} [nombre]                     quita un bot concreto
#    cw live botlevel   {streamer} [nivel 1-3] (nombre|todos)   cambia la inteligencia de los bots rivales
#    cw live slowbots   {streamer} [segundos]                   ralentiza a los bots rivales
#    cw live freezebots {streamer} [segundos]                   congela a los bots rivales
#
#  Notas:
#   - Nivel de los bots: 1 fácil ★, 2 normal ★★, 3 difícil ★★★.
#   - ally / enemy solo importan en arenas de equipos: ally = bot del equipo del streamer,
#     enemy = bot de un equipo rival, auto = el equipo con menos miembros. En arenas "solo"
#     todos los bots son rivales con un color nuevo.
#   - Si el nombre del espectador ya existe en la partida se le añade _2, _3...
#   - Límites en ColorWar (config.yml, sección "live"): max-bots (bots de espectadores a la vez)
#     y max-seconds (tope de duración de cada efecto).
#   - Las acciones EFFECT / GIVE / SPAWN de este plugin NO se usan aquí: pisarían la velocidad
#     que gestiona ColorWar. Usa siempre "cw live ...".
#   - RUN elimina las barras "/": escribe "cw live ..." sin barra.
#
#  Para probar un evento (el streamer debe estar dentro de una partida):
#      /tiktok test follow exampleViewer exampleStreamer
#      /tiktok test gift exampleViewer exampleStreamer Rose 1
#  o directamente en consola:  cw live addbot MiJugador 2 auto 1 Pepe
#  Después de editar este archivo usa /tiktok reload.


FOLLOW_SPAM_PROTECTION: true


# ============================================================
# FOLLOW  ->  un bot nivel 1 con el nombre del nuevo seguidor entra a la partida
# ============================================================
FOLLOW_EVENTS:
  #test /tiktok test follow exampleViewer exampleStreamer
  - RUN CONSOLE title {streamer} subtitle {"text":"te ha seguido y entra como bot","color":"white"}
  - RUN CONSOLE title {streamer} title {"text":"{USER}","color":"light_purple"}
  - RUN CONSOLE cw live addbot {streamer} 1 auto 1 {USER}
  - SOUND ENTITY_EXPERIENCE_ORB_PICKUP {streamer}


# ============================================================
# LIKES  ->  impulsos de velocidad y territorio regalado
# ============================================================
LIKE_EVENTS:
  #test /tiktok test like exampleViewer exampleStreamer 150
  50:
    - RUN CONSOLE title {streamer} subtitle {"text":"envió 50 likes: ¡velocidad!","color":"white"}
    - RUN CONSOLE title {streamer} title {"text":"{USER}","color":"green"}
    - RUN CONSOLE cw live speed {streamer} 1 10
  150:
    - RUN CONSOLE title {streamer} subtitle {"text":"envió 150 likes: ¡más velocidad y terreno!","color":"white"}
    - RUN CONSOLE title {streamer} title {"text":"{USER}","color":"gold"}
    - RUN CONSOLE cw live speed {streamer} 2 15
    - RUN CONSOLE cw live grow {streamer} 1
  500:
    - RUN CONSOLE title {streamer} subtitle {"text":"envió 500 likes: ¡escudo y terreno!","color":"white"}
    - RUN CONSOLE title {streamer} title {"text":"{USER}","color":"aqua"}
    - RUN CONSOLE cw live shield {streamer} 15
    - RUN CONSOLE cw live grow {streamer} 3


# ============================================================
# GIFTS
# ============================================================
# La clave es el nombre del regalo tal como lo llama TikTok (mayúsculas y minúsculas importan).
# Aquí hay regalos que AYUDAN al streamer, regalos que lo TROLLEAN y regalos que mueven a los BOTS.
# {AMOUNT} = cantidad de regalos; se usa como multiplicador cuando tiene sentido.

GIFT_EVENTS:

  # ---------- AYUDAN AL STREAMER ----------

  Rose:   # velocidad II durante 15 s
    #/tiktok test gift exampleViewer exampleStreamer Rose 1
    - RUN CONSOLE title {streamer} subtitle {"text":"envió una Rosa x{AMOUNT}: ¡velocidad!","color":"white"}
    - RUN CONSOLE title {streamer} title {"text":"{USER}","color":"red"}
    - RUN CONSOLE cw live speed {streamer} 2 15
    - SOUND ENTITY_PLAYER_LEVELUP {streamer}

  White Rose:   # escudo 10 s
    #/tiktok test gift exampleViewer exampleStreamer "White Rose" 1
    - RUN CONSOLE title {streamer} subtitle {"text":"envió una Rosa blanca x{AMOUNT}: ¡escudo!","color":"white"}
    - RUN CONSOLE title {streamer} title {"text":"{USER}","color":"white"}
    - RUN CONSOLE cw live shield {streamer} 10
    - SOUND ITEM_SHIELD_BLOCK {streamer}

  Finger Heart:   # +2% de territorio por regalo
    #/tiktok test gift exampleViewer exampleStreamer "Finger Heart" 1
    - RUN CONSOLE title {streamer} subtitle {"text":"envió Corazón coreano x{AMOUNT}: ¡terreno!","color":"white"}
    - RUN CONSOLE title {streamer} title {"text":"{USER}","color":"light_purple"}
    - RUN CONSOLE cw live grow {streamer} 2 {AMOUNT}

  GG:   # aliado de nivel 1 con el nombre del espectador (en equipos, del equipo del streamer)
    #/tiktok test gift exampleViewer exampleStreamer GG 1
    - RUN CONSOLE title {streamer} subtitle {"text":"envió GG x{AMOUNT}: ¡un aliado!","color":"white"}
    - RUN CONSOLE title {streamer} title {"text":"{USER}","color":"green"}
    - RUN CONSOLE cw live addbot {streamer} 1 ally 1 {USER}

  You're awesome:   # perrito: aliado de nivel 2
    #/tiktok test gift exampleViewer exampleStreamer "You're awesome" 1
    - RUN CONSOLE title {streamer} subtitle {"text":"envió Eres increíble x{AMOUNT}: ¡un aliado fuerte!","color":"white"}
    - RUN CONSOLE title {streamer} title {"text":"{USER}","color":"gold"}
    - RUN CONSOLE cw live addbot {streamer} 2 ally 1 {USER}

  Heart Me:   # quiéreme: velocidad III 20 s + escudo 8 s
    #/tiktok test gift exampleViewer exampleStreamer "Heart Me" 1
    - RUN CONSOLE title {streamer} subtitle {"text":"envió Quiéreme x{AMOUNT}: ¡modo turbo!","color":"white"}
    - RUN CONSOLE title {streamer} title {"text":"{USER}","color":"light_purple"}
    - RUN CONSOLE cw live speed {streamer} 3 20
    - RUN CONSOLE cw live shield {streamer} 8

  Galaxy:   # galaxia: gran regalo, +8% de territorio, escudo y velocidad
    #/tiktok test gift exampleViewer exampleStreamer Galaxy 1
    - RUN CONSOLE title {streamer} subtitle {"text":"envió Galaxia x{AMOUNT}: ¡poder total!","color":"white"}
    - RUN CONSOLE title {streamer} title {"text":"{USER}","color":"dark_purple"}
    - RUN CONSOLE cw live grow {streamer} 8 {AMOUNT}
    - RUN CONSOLE cw live shield {streamer} 20
    - RUN CONSOLE cw live speed {streamer} 2 20

  # ---------- CONTRA LOS BOTS ----------

  Tiktok:   # ralentiza a los bots rivales 10 s
    #/tiktok test gift exampleViewer exampleStreamer Tiktok 1
    - RUN CONSOLE title {streamer} subtitle {"text":"envió TikTok x{AMOUNT}: ¡bots más lentos!","color":"white"}
    - RUN CONSOLE title {streamer} title {"text":"{USER}","color":"aqua"}
    - RUN CONSOLE cw live slowbots {streamer} 10

  Rosa:   # rosa grande: congela a los bots rivales 8 s
    #/tiktok test gift exampleViewer exampleStreamer Rosa 1
    - RUN CONSOLE title {streamer} subtitle {"text":"envió Rosa grande x{AMOUNT}: ¡bots congelados!","color":"white"}
    - RUN CONSOLE title {streamer} title {"text":"{USER}","color":"red"}
    - RUN CONSOLE cw live freezebots {streamer} 8

  Hearts:   # elimina un bot rival por regalo
    #/tiktok test gift exampleViewer exampleStreamer Hearts 1
    - RUN CONSOLE title {streamer} subtitle {"text":"envió Corazones x{AMOUNT}: ¡bot eliminado!","color":"white"}
    - RUN CONSOLE title {streamer} title {"text":"{USER}","color":"dark_red"}
    - RUN CONSOLE cw live killbot {streamer} {AMOUNT}

  # ---------- TROLL: COMPLICAN LA PARTIDA ----------

  Doughnut:   # rosquilla: el streamer va lento 8 s
    #/tiktok test gift exampleViewer exampleStreamer Doughnut 1
    - RUN CONSOLE title {streamer} subtitle {"text":"envió Rosquilla x{AMOUNT}: ¡a cámara lenta!","color":"white"}
    - RUN CONSOLE title {streamer} title {"text":"{USER}","color":"yellow"}
    - RUN CONSOLE cw live slow {streamer} 1 8

  Perfume:   # los bots rivales pasan a nivel difícil
    #/tiktok test gift exampleViewer exampleStreamer Perfume 1
    - RUN CONSOLE title {streamer} subtitle {"text":"envió Perfume x{AMOUNT}: ¡bots más listos!","color":"white"}
    - RUN CONSOLE title {streamer} title {"text":"{USER}","color":"gold"}
    - RUN CONSOLE cw live botlevel {streamer} 3

  Hat and Mustache:   # rival de nivel difícil con el nombre del espectador
    #/tiktok test gift exampleViewer exampleStreamer "Hat and Mustache" 1
    - RUN CONSOLE title {streamer} subtitle {"text":"envió Sombrero x{AMOUNT}: ¡un rival difícil!","color":"white"}
    - RUN CONSOLE title {streamer} title {"text":"{USER}","color":"dark_aqua"}
    - RUN CONSOLE cw live addbot {streamer} 3 enemy {AMOUNT} {USER}


# ============================================================
# SHARE  ->  escudo corto
# ============================================================
SHARE_EVENTS:
  #/tiktok test share exampleViewer exampleStreamer
  - RUN CONSOLE title {streamer} subtitle {"text":"compartió el LIVE: ¡escudo!","color":"white"}
  - RUN CONSOLE title {streamer} title {"text":"{USER}","color":"aqua"}
  - RUN CONSOLE cw live shield {streamer} 6


CHAT_BLACKLIST: []

# Silencia los avisos del plugin (están en inglés); los titles ya los hacen los comandos de arriba
INGAME_ALERTS: none
