name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar con Maven
        run: mvn -B -ntp clean package

      - name: Subir el .jar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ColorWar
          path: target/ColorWar-*.jar
          if-no-files-found: error

      - name: Publicar release (solo al crear una etiqueta v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/ColorWar-*.jar

      - name: Publicar .jar en la release "latest" (cada push a main)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest target/ColorWar-*.jar \
            --target "${{ github.sha }}" \
            --title "ColorWar (última versión)" \
            --notes "Compilación automática del commit ${{ github.sha }}. Descarga el .jar directamente."
