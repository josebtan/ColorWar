# ===== ColorWar =====
countdown-seconds: 15        # cuenta atrás cuando hay jugadores suficientes
start-radius: 2              # territorio inicial (2 = 5x5, 1 = 3x3)
speed-level: 1               # nivel de velocidad durante la partida (0 = ninguna)
blocks-per-tick: 1500        # bloques repintados por tick (baja si hay lag)
base-block: WHITE_CONCRETE   # suelo vacío de la arena
win-percent: 100             # si alguien llega a este % del mapa gana al instante
time-limit: false              # false = sin tiempo límite (termina al quedar un ganador o completar el mapa); true = usa la duración de cada arena
victory-spread-seconds: 5     # al ganar, el color del ganador cubre todo el campo en este tiempo
end-delay-seconds: 8         # segundos de celebración (fuegos artificiales) antes de cerrar la partida
death-spectate-seconds: 4    # segundos en espectador al morir, luego sale de la partida
team-respawn: false          # true = en equipos reaparecen en vez de salir
border-block: BLACK_CONCRETE # bloque del borde visible alrededor de la arena
border-height: 3             # altura del borde (1 = solo una línea en el suelo)
team-respawn-seconds: 5      # reaparición en modo equipos
friendly-trail-safe: true    # en equipos, pisar la estela de un compañero no lo mata
team-merge-trails: true      # en equipos, al tocar la estela de un compañero se fusionan y se capturan juntas
own-trail-kills: false       # true = chocar con tu propia estela te elimina
block-commands: true         # bloquea comandos dentro de la partida (excepto /cw)

# Recompensas. Los comandos se ejecutan desde consola; {player} = nombre del jugador.
# Las "monedas" son una moneda interna que se ve en el menú de estadísticas.
rewards:
  participation:
    coins: 10
    commands: []
  placements:
    1:
      coins: 100
      commands:
        - "say {player} ganó una partida de ColorWar!"
    2:
      coins: 60
      commands: []
    3:
      coins: 30
      commands: []
  per-kill:
    coins: 5
    commands: []

# Bots en partidas normales: al entrar el primer jugador empieza una espera para que se unan más;
# al terminar, los puestos libres se rellenan con bots (solo una vez, al empezar).
bots:
  enabled: true          # false = hace falta el mínimo de jugadores de la arena
  wait-seconds: 30       # espera desde que entra el primer jugador (se acorta a 5 s si se llena)
  fill-to: max           # max = hasta el máximo de la arena | min = solo hasta el mínimo
  fill-level: 0          # 0 = nivel aleatorio (1-3) | 1, 2 o 3 = nivel fijo
  delay-ticks: 3         # velocidad de los bots (menos = más rápidos)
  stats-with-bots: true  # false = las partidas con bots no dan estadísticas ni premios
  names: [Alex, Bruno, Carla, Diego, Elena, Facu, Gabi, Hugo, Irene, Jorge, Kira, Lucas]

# Modo debug (/cw debug [arena] [bots]): partida de prueba en solitario
debug:
  default-bots: 2        # bots que se añaden por defecto
  default-level: 2       # inteligencia por defecto: 1 fácil, 2 normal, 3 difícil
  bot-delay-ticks: 3     # velocidad de los bots (menos = más rápidos)

# Consejos
tips:
  third-person: true     # al empezar, sugiere pulsar F5 para la tercera persona

# Placeholders (PlaceholderAPI)
placeholders:
  empty: "---"           # texto de las posiciones vacías en las clasificaciones

config-version: 2
