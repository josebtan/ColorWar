# ===== ColorWar =====
countdown-seconds: 15        # cuenta atrás cuando hay jugadores suficientes
start-radius: 2              # territorio inicial (2 = 5x5, 1 = 3x3)
speed-level: 1               # nivel de velocidad durante la partida (0 = ninguna)
blocks-per-tick: 1500        # bloques repintados por tick (baja si hay lag)
base-block: SMOOTH_STONE     # suelo vacío de la arena
win-percent: 100             # la partida termina si alguien llega a este % del mapa
team-respawn-seconds: 5      # reaparición en modo equipos
friendly-trail-safe: true    # en equipos, pisar la estela de un compañero no lo mata
block-commands: true         # bloquea comandos dentro de la partida (excepto /cw)

# Recompensas. Los comandos se ejecutan desde consola; {player} = nombre del jugador.
# Las "monedas" son una moneda interna que se ve en el menú de estadísticas.
rewards:
  participation:
    coins: 10
    commands: []
  placements:
    1:
      coins: 100
      commands:
        - "say {player} ganó una partida de ColorWar!"
    2:
      coins: 60
      commands: []
    3:
      coins: 30
      commands: []
  per-kill:
    coins: 5
    commands: []
