name: ColorWar
version: 1.0.0
main: dev.colorwar.ColorWarPlugin
api-version: '1.21'
softdepend: [PlaceholderAPI]
description: Minijuego de conquista de territorio con bloques de concreto
commands:
  colorwar:
    description: Comando principal de ColorWar
    aliases: [cw, colorwars]
    usage: /<command> [menu|join|leave|list|top|stats]
permissions:
  # Los comandos de jugador (/cw, join, leave, list, top, stats, menús) no necesitan permiso.
  colorwar.admin:
    description: Administrar arenas y todo el plugin
    default: op
    children:
      colorwar.streamer: true
  colorwar.streamer:
    description: Streamers - gestionar bots en su partida (/cw debug addbot|addbots|removebot|setlevel|shrink), normal o debug
    default: false
